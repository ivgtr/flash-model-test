id: url-codec
difficulty: easy

description: >
  URL 文字列の percent-encoding とデコードを行うツール。encode（文字列 →
  percent-encoding）と decode（percent-encoding → 文字列）をブラウザ上で行う。

requirements:
  - "encode: 入力文字列を percent-encoding へ変換する。エンコード規則は encodeURIComponent と同じ（英数字と - _ . ! ~ * ' ( ) はそのまま、それ以外は UTF-8 で percent-encode される）"
  - 'decode: percent-encoding を元の文字列へ復号する'
  - '入力欄と出力欄を持ち、方向（encode / decode）を切り替えられる'
  - '結果はコピーできる（既存の CopyButton を使用）'
  - '復号失敗時はユーザーに見えるエラーメッセージを表示し、出力欄にゴミを残さない'

edge cases:
  - 'empty input: 空文字列の encode / decode は空文字列を返す（エラーにしない）'
  - 'Unicode: 日本語や絵文字が UTF-8 percent-encoding として正しく round-trip できる'
  - 'malformed percent encoding: % の後に 2 桁の 16 進数が続かない入力（例: %zz、末尾の孤立した %）はエラーとして報告する（黙ってリテラルとして返してはいけない）'
  - "アンコーディング不要な文字（英数字・- _ . ! ~ * ' ( )）はそのまま通す"
  - 'decode 入力が空文字列の場合は空文字列を返す'

required tests:
  - logic.test.ts:
      - 'ascii 文字列の encode / decode round-trip'
      - 'Unicode（日本語・絵文字）の round-trip'
      - "encode の非エスケープ文字（- _ . ! ~ * ' ( )）がそのまま残ること"
      - 'empty input'
      - 'malformed percent encoding（%zz・孤立した %）のエラー'
  - Tool.test.tsx:
      - 'ユーザーが入力して encode できること'
      - 'エラー時にユーザーに見えるメッセージが出ること'

allowed paths:
  - packages/tools/url-codec/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（encodeURIComponent / decodeURIComponent 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
