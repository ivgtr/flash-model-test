id: base64-codec
difficulty: easy

description: >
  UTF-8 文字列と Base64 を相互変換するツール。encode（文字列 → Base64）と
  decode（Base64 → 文字列）をブラウザ上で行う。

requirements:
  - 'encode: UTF-8 文字列を標準アルファベット（A-Z a-z 0-9 + /）とパディング（=）を使う Base64 へ変換する'
  - 'decode: Base64 を UTF-8 文字列へ復号する'
  - '入力欄（encode 用）と出力欄を持ち、方向（encode / decode）を切り替えられる'
  - '結果はコピーできる（既存の CopyButton を使用）'
  - '復号失敗時はユーザーに見えるエラーメッセージを表示し、出力欄にゴミを残さない'

edge cases:
  - 'empty input: 空文字列の encode / decode は空文字列を返す（エラーにしない）'
  - 'Unicode: 日本語や絵文字などマルチバイト文字が UTF-8 として正しく round-trip できる（Latin-1 として解釈する実装は不可）'
  - 'invalid Base64: 非アルファベット文字・不正な長さ・不正なパディングはエラーとして報告する（黙って切り詰めたり部分復号を返してはいけない）'
  - 'decode 入力が空文字列の場合は空文字列を返す'

required tests:
  - logic.test.ts:
      - 'ascii 文字列の encode / decode round-trip'
      - 'Unicode（日本語・絵文字）の round-trip'
      - 'empty input'
      - 'invalid Base64（不正文字・長さ・パディング）のエラー'
      - 'encode 結果が期待する標準 Base64 文字列と一致すること'
  - Tool.test.tsx:
      - 'ユーザーが入力して encode できること'
      - 'エラー時にユーザーに見えるメッセージが出ること'

allowed paths:
  - packages/tools/base64-codec/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（TextEncoder / TextDecoder / btoa 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
