id: unix-timestamp
difficulty: easy-medium

description: >
  Unix timestamp と日時を相互変換するツール。timestamp → 日時表示と、
  日時入力 → timestamp（秒）をブラウザ上で行う。

requirements:
  - 'timestamp → date: 入力された timestamp を人間が読める日時に変換して表示する'
  - 'date → timestamp: 日時入力（datetime-local 等）を Unix timestamp（秒）へ変換して表示する'
  - 'seconds / milliseconds: 10 桁の入力を秒、13 桁の入力をミリ秒として自動判別し、どちらでも正しく変換する'
  - '10 桁でも 13 桁でもない入力はエラーとして報告する'
  - 'timezone: 変換結果はローカルタイムゾーンと UTC の両方を表示する'
  - '秒 ↔ ミリ秒の変換値も表示する'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'invalid value: 数字以外・負数・10/13 桁以外の数字はユーザーに見えるエラーを表示する'
  - 'empty input: 未入力のまま変換しようとした場合はエラー（または無効化）にする'
  - 'boundary values: 0、10 桁の最大値（9999999999 = 2038-11-20 相当）などがエラーなく変換できる'
  - 'タイムゾーン表示は実行環境のローカルタイムゾーンを使い、UTC との両方を明示する'
  - 'うるう秒・うるう年などは標準の Date の挙動に従う'

required tests:
  - logic.test.ts:
      - '秒（10 桁）→ 日時の変換'
      - 'ミリ秒（13 桁）→ 日時の変換'
      - '日時 → 秒への変換'
      - 'seconds / milliseconds の自動判別（境界: 10 桁と 13 桁）'
      - 'invalid value（数字以外・負数・不正な桁数）のエラー'
      - 'boundary values（0、10 桁最大値）'
  - Tool.test.tsx:
      - 'timestamp → date の表示がユーザーに見えること'
      - 'エラー時にユーザーに見えるメッセージが出ること'

allowed paths:
  - packages/tools/unix-timestamp/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（Date / Intl.DateTimeFormat 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
