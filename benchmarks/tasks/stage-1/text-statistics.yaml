id: text-statistics
difficulty: easy-medium

description: >
  テキストの統計情報（文字数・単語数・行数）を表示するツール。ブラウザ上で
  リアルタイムに集計する。

requirements:
  - 'character count: Unicode コードポイント単位で文字数を数える（サロゲートペアを 1 文字として扱い、UTF-16 コードユニット単位の .length は使わない）'
  - 'word count: 空白文字（whitespace）区切りの単語数を数える'
  - "line count: 改行（\\n）区切りの行数を数える"
  - '集計は入力のたびに即時更新される'
  - '入力が空の場合は各カウント 0 を表示する'

contract (exact expectations):
  - 'characters = 入力文字列の Unicode コードポイント数'
  - 'words = 入力文字列を空白文字で分割したときの空でない断片の数（先頭・末尾・連続する空白は無視する）'
  - "lines = 改行で区切った行の数。空文字列は 0 行。文字列は改行の数 + 1 行（例: \"a\\nb\" は 2 行、\"a\\n\" は 2 行）"
  - '空白のみの入力は characters は実際のコードポイント数、words は 0 を返す'

edge cases:
  - 'empty input: characters 0 / words 0 / lines 0'
  - 'Unicode: 絵文字・結合文字などコードポイント単位で正しく数える'
  - 'whitespace handling: タブ・複数スペース・全角スペースを空白として扱う'
  - '改行のみ・空白のみの入力がエラーにならない'
  - '各行の前後の空白は行数に影響しない'

required tests:
  - logic.test.ts:
      - 'ascii テキストの characters / words / lines'
      - 'empty input'
      - '空白のみ・改行のみの入力'
      - 'Unicode（絵文字・日本語）の文字数がコードポイント単位であること'
      - '連続空白・先頭末尾空白の word count'
  - Tool.test.tsx:
      - '入力すると統計が表示されること'
      - '空入力で 0 表示になること'

allowed paths:
  - packages/tools/text-statistics/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（Array.from / String.prototype.split 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
