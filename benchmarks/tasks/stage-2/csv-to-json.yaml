id: csv-to-json
difficulty: medium

description: >
  CSV テキストを JSON へ変換するツール。先頭行をヘッダーとしてオブジェクト配列を
  生成する。区切り文字と引用符に対応する。

requirements:
  - '入力 CSV の先頭行をヘッダーとし、以降の行をオブジェクト配列に変換する'
  - '区切り文字を選択できる: コンマ / セミコロン / タブ（デフォルト コンマ）'
  - 'ダブルクォートによるフィールド引用をサポートする（引用内の区切り文字・改行・"" エスケープ）'
  - '空のフィールドは空文字列として扱う'
  - '出力は 2 スペースインデントの整形された JSON 文字列'
  - '出力はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列はエラーとして報告する（ヘッダーが存在しないため）'
  - 'ヘッダー行のみ（データ行 0）の場合は空配列 [] を出力する'
  - '列数不一致の行（ヘッダーとデータで列数が異なる）はエラーとして報告する'
  - '引用フィールド内の区切り文字（"a,b"）が 1 フィールドになること'
  - '引用フィールド内の改行がフィールド値に含まれること'
  - 'エスケープされた引用符（""）が 1 つの " になること'
  - '重複ヘッダー名はエラーとして報告する'
  - '空白のみの行・空行は無視する'

required tests:
  - logic.test.ts:
      - '基本 2x2 CSV の変換結果が期待 JSON と一致すること'
      - 'ヘッダー行のみで [] になること'
      - '引用フィールド（区切り文字・改行・"" エスケープ）のパース'
      - '列数不一致のエラー'
      - '重複ヘッダーのエラー'
      - '空行の無視'
      - 'セミコロン / タブ区切りの変換'
      - '空フィールドの扱い'
  - Tool.test.tsx:
      - 'ユーザーが CSV を入力して変換できること'
      - 'エラーがユーザーに見えること'

allowed paths:
  - packages/tools/csv-to-json/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
