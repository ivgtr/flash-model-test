id: color-converter
difficulty: medium

description: >
  色の表現形式を変換するツール。HEX / RGB / HSL の間で相互変換し、各形式の
  同時表示を行う。アルファ値にも対応する。

requirements:
  - '入力を受け付ける形式: HEX（#rgb / #rgba / #rrggbb / #rrggbbaa）、rgb() / rgba()、hsl() / hsla()（コンマ区切り）'
  - '入力から RGBA 値（r g b は 0-255、a は 0-1）へ正規化する'
  - 'HEX / RGB / HSL の 3 形式（アルファ含む）を同時に一覧表示する'
  - '出力の丸め規則: HEX は小文字、RGB は整数、HSL の h は整数（0-360）、s / l はパーセント整数、a は小数第 3 位（Number(x.toFixed(3)) で正規化）'
  - '結果はコピーできる（既存の CopyButton を使用）'
  - 'パースできない入力はユーザーに見えるエラーメッセージを表示し、出力欄にゴミを残さない'

edge cases:
  - 'empty input: 空文字列は空文字列を返す（エラーにしない）'
  - '#fff と #ffffff が同値になる'
  - '大文字の HEX（#FF0000）を許容し小文字で出力する'
  - 'rgb() の値が範囲外（>255 や <0）の場合はエラー'
  - 'hsl() の h が 360 以上のとき 0-360 へ正規化する（例: 720 → 0）'
  - 'アルファ: #rgba / #rrggbbaa / rgba() / hsla() を正しく扱い、無指定は a=1'
  - 'RGB → HSL → RGB の round-trip で値が保持されること'
  - 'パースエラー時は前回の出力を保持せずエラーメッセージに置き換える'

required tests:
  - logic.test.ts:
      - '#ff0000 → rgb(255, 0, 0) / hsl の期待値との一致'
      - '#fff の正規化'
      - 'rgb() / rgba() 入力のパースと出力'
      - 'hsl() 入力のパースと出力（h の正規化を含む）'
      - 'アルファ付き入力（#rgba / #rrggbbaa / rgba / hsla）'
      - 'RGB → HSL → RGB round-trip'
      - 'エラー（範囲外 / 不正形式）'
      - 'empty input'
  - Tool.test.tsx:
      - 'ユーザーが入力して変換結果が表示されること'
      - '不正入力でエラーが見えること'

allowed paths:
  - packages/tools/color-converter/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
