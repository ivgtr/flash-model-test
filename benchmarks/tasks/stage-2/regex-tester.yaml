id: regex-tester
difficulty: medium

description: >
  正規表現のパターンをテスト文字列に対して実行し、マッチ結果を表示するツール。
  JavaScript の RegExp を使用する。

requirements:
  - '入力: パターン文字列 + フラグ（g / i / m / s / u を checkbox で選択）+ テスト文字列'
  - 'Test ボタンで実行し、マッチ数を表示する'
  - '各マッチについて: マッチした文字列・開始インデックス・キャプチャグループの内容を一覧表示する'
  - 'グループ名（named groups）がある場合はグループ名も表示する'
  - '無効なパターン（例: "("）はユーザーに見えるエラーメッセージを表示する'
  - 'パターンが空の場合はエラーを表示する'
  - 'マッチ 0 件の場合は「No match」を表示する'

edge cases:
  - 'g フラグなしの場合は最初のマッチのみ表示する（RegExp の仕様どおり）'
  - 'i / m / s / u フラグの効果が反映されること'
  - 'キャプチャグループが参加しないマッチ（例: /(a)?b/ で "b"）では undefined を空欄で表示する'
  - 'named groups（例: (?<year>\d{4})）の名前と値が表示されること'
  - 'u フラグでの不正パターン（例: 孤立サロゲート）もエラーとして報告される'
  - '巨大入力でもフリーズしないこと（特に g フラグと ^ $ の組み合わせに注意）'

required tests:
  - logic.test.ts:
      - 'g フラグありで全マッチの文字列・インデックスが正しいこと'
      - 'g フラグなしで最初のマッチのみ返すこと'
      - 'キャプチャグループの値が正しいこと'
      - 'named groups の名前と値が正しいこと'
      - '未参加グループが undefined として返ること'
      - '無効パターンのエラー'
      - '空パターンのエラー'
      - 'i / m / s / u フラグの効果'
  - Tool.test.tsx:
      - 'ユーザーがパターンと文字列を入力して Test を押すと結果が見えること'
      - '無効パターンでエラーが見えること'

allowed paths:
  - packages/tools/regex-tester/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能（RegExp, String.matchAll 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
