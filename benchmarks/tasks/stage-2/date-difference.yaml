id: date-difference
difficulty: medium

description: >
  2 つの日時（日付 + 時刻）の差を計算するツール。暦上の年・月・日と、総時・総分・
  総秒の両方を表示する。

requirements:
  - '開始 / 終了の 2 つの datetime-local 入力を用意する'
  - '終了が開始より前の場合はエラーにせず、絶対差として表示する（どちらが前でも結果は同じ）'
  - '差の表示: 暦上の「y 年 m ヶ月 d 日」（y/m/d は負にならない）+ 総時間 + 総分数 + 総秒数 + 総日数'
  - '総日数は 24 時間単位（うるう秒は考慮しない）'
  - '計算は UTC ベースで行う（テストのタイムゾーン依存を避ける）'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - '両方空: 差を計算しない（何も表示しない）'
  - '一方だけ入力: エラーにするか計算しないかのどちらでもよいが、その挙動にテストを合わせる'
  - '同日同時刻は 0 年 0 ヶ月 0 日、総時間 0 を表示する'
  - '月末境界（1/31 から 2/28、うるう年 2/29）で暦上の月差が正しいこと'
  - '日付が 1 日差で総時間が 24 になること'
  - '時刻の桁が正しく丸められないこと（秒未満は切り捨て）'

required tests:
  - logic.test.ts:
      - '総日数・総時間・総分・総秒の計算（固定日時、UTC で表現）'
      - '暦上の年・月・日差の計算（月またぎ、年またぎ、月末）'
      - '開始と終了を入れ替えても同じ結果になること'
      - '同時刻の差がすべて 0 になること'
      - 'うるう年 2/29 を含む計算'
  - Tool.test.tsx:
      - '2 つの入力を指定して計算すると結果が表示されること'

allowed paths:
  - packages/tools/date-difference/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能（Date, Intl 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
