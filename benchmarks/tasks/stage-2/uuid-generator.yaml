id: uuid-generator
difficulty: easy

description: >
  UUID v4 を生成するツール。生成数を指定でき、複数まとめてコピーできる。

requirements:
  - 'UUID v4 を crypto.randomUUID() で生成する'
  - '生成数を 1〜100 の範囲で指定できる（デフォルト 1）'
  - '生成ボタンで指定数の UUID を 1 行 1 個で表示する'
  - '各 UUID を個別にコピーでき、全 UUID をまとめてコピーできる（既存の CopyButton を使用）'
  - '大文字 / 小文字を選択できる（デフォルトは小文字）'

edge cases:
  - '生成数が範囲外（0 以下、100 超、非数値）のときはエラーを表示する'
  - '生成された UUID は RFC 4122 v4 の形式に一致する（8-4-4-4-12、バージョン 4、バリアント 8/9/a/b）'
  - '複数生成したとき重複がないこと（重複は実質不可能だが、形式チェックで保証する）'
  - '空状態では出力欄に何も表示しない'

required tests:
  - logic.test.ts:
      - '生成結果が UUID v4 の形式（正規表現 + バージョン/バリアント）に一致すること'
      - '大文字指定で大文字になること'
      - '生成数 1 と複数（例: 10）で個数が合うこと'
      - '生成数バリデーション（0, 101, 非数値はエラー）'
  - Tool.test.tsx:
      - 'ユーザーが Generate を押すと UUID が表示されること'
      - '生成数が不正なときエラーが見えること'
      - 'Copy ボタンが有効になること'

allowed paths:
  - packages/tools/uuid-generator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（crypto.randomUUID）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
