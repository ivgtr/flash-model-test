id: byte-size-converter
difficulty: medium

description: >
  バイト数を複数の単位へ同時に変換して表示するツール。10 進（1000 倍）と 2 進
  （1024 倍）の両方を扱う。

requirements:
  - '入力: 数値 + 単位（B / KB / MB / GB / TB / KiB / MiB / GiB / TiB から select）'
  - '入力値をバイト数へ正規化し、全単位の表記を一覧表示する（9 単位すべて）'
  - '10 進系（KB MB GB TB）は 1000 倍、2 進系（KiB MiB GiB TiB）は 1024 倍とする'
  - 'バイト数は BigInt で正確に保持する（整数にするため小数点以下は四捨五入）'
  - '小数入力（1.5 MB など）をサポートする'
  - '表示値は有効数字 6 桁以内に丸める（Number(value.toPrecision(6)).toString() 形式）'
  - 'B は常に整数表記（小数を含まない）'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列は空文字列を返す（エラーにしない）'
  - '負数・非数値はエラーとして報告する'
  - '0 は全単位で 0 と表示する'
  - '巨大な値（例: 1024^10 バイト相当）でも BigInt で正確に計算する'
  - '小数入力（0.5 KiB、1.25 MB）の丸めが正しいこと'
  - 'バイト計算の四捨五入: 0.5 バイト未満の端数は 0 バイト（例: 0.4 B の入力は 0）'

required tests:
  - logic.test.ts:
      - '1 KB が 1000 B、1 KiB が 1024 B であること'
      - '1024 B の入力で 1 KiB と 1.024 KB が表示されること'
      - '10 進と 2 進の換算係数が仕様どおりであること'
      - '小数入力の丸め'
      - '0 の表示'
      - 'エラー（負数 / 非数値）'
      - '巨大な値の BigInt 計算'
  - Tool.test.tsx:
      - 'ユーザーが値と単位を指定して変換できること'
      - 'エラーがユーザーに見えること'

allowed paths:
  - packages/tools/byte-size-converter/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能（BigInt 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
