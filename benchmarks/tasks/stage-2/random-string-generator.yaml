id: random-string-generator
difficulty: medium

description: >
  指定した文字セット・長さでランダム文字列を生成するツール。crypto の乱数を使う。

requirements:
  - '長さ（1〜1024、デフォルト 16）のランダム文字列を生成する'
  - '文字セットを checkbox で選択できる: 小文字（a-z）/ 大文字（A-Z）/ 数字（0-9）/ 記号（!@#$%^&*()-_=+[]{};:,.?/~）'
  - 'デフォルトで全セット選択状態'
  - '各セットの文字は等確率で選ぶ（crypto.getRandomValues を使用）'
  - 'Generate ボタンで生成し、結果はコピーできる（既存の CopyButton を使用）'
  - '生成された文字列は選択したセットの文字だけから構成される'

edge cases:
  - '長さが範囲外（0 以下、1025 超、非数値）はエラーを表示する'
  - '文字セットが 1 つも選択されていないときはエラーを表示する'
  - '選択セットが 1 つだけの場合はそのセットの文字のみで構成される'
  - '長さ 1 で生成できる'
  - '生成結果の長さは常に指定長と一致する'

required tests:
  - logic.test.ts:
      - '生成結果の長さが指定長と一致すること'
      - '生成結果の全文字が選択セットに属すること（セット毎に検証）'
      - '1 セットのみ選択時の検証'
      - '長さバリデーション（0, 1025, 非数値）'
      - 'セット未選択のエラー'
      - '各セットの文字集合が仕様どおりであること'
  - Tool.test.tsx:
      - 'Generate で文字列が表示されること'
      - '不正な長さでエラーが見えること'
      - 'Copy ボタンが有効になること'

allowed paths:
  - packages/tools/random-string-generator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（crypto.getRandomValues）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
