id: hash-generator
difficulty: medium

description: >
  テキストのハッシュ値を生成するツール。Web Crypto API の SHA アルゴリズムを
  使用し、16 進文字列で表示する。

requirements:
  - 'crypto.subtle.digest で SHA-1 / SHA-256 / SHA-384 / SHA-512 を計算する'
  - 'アルゴリズムを select で選択できる（デフォルト SHA-256）'
  - '入力は UTF-8 文字列として扱う（日本語・絵文字も正しくハッシュ化される）'
  - '出力は小文字 16 進文字列'
  - '結果はコピーできる（既存の CopyButton を使用）'
  - '計算は async で行い、結果は await 後に表示する'

edge cases:
  - 'empty input: 空文字列のハッシュを計算する（エラーにしない。例: SHA-256 の空文字列ハッシュは e3b0c442...）'
  - 'Unicode 入力が UTF-8 バイトとして正しくハッシュ化されること'
  - '既知のテストベクタと一致すること（"abc" の SHA-1 / SHA-256 / SHA-384 / SHA-512）'
  - '各アルゴリズムの出力長が正しいこと（40 / 64 / 96 / 128 桁）'
  - 'アルゴリズム切替で再計算できること'

required tests:
  - logic.test.ts:
      - '"abc" の SHA-1 / SHA-256 / SHA-384 / SHA-512 が既知の期待値と一致すること'
      - '空文字列のハッシュ（"abc" 以外のベクタ含む）'
      - 'Unicode 入力（例: "日本語"）のハッシュが期待値と一致すること'
      - '出力長の検証'
      - '4 アルゴリズムすべてが正しく分岐すること'
  - Tool.test.tsx:
      - 'ユーザーが入力して Hash を押すと結果が表示されること'
      - 'アルゴリズムを切り替えられること'
      - 'Copy ボタンが有効になること'

allowed paths:
  - packages/tools/hash-generator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（crypto.subtle, TextEncoder）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
