id: slug-generator
difficulty: easy

description: >
  任意のテキストから URL 用スラグを生成するツール。小文字化、ダイアクリティカル
  マーク除去、記号のハイフン化を行う。

requirements:
  - '入力テキストから URL フレンドリーなスラグを生成する'
  - 'ASCII 文字は小文字化する'
  - 'ダイアクリティカルマーク付きのラテン文字は基本文字へ正規化する（é → e, ü → u）'
  - '英数字以外の文字（記号・空白）はハイフン（-）に置き換える'
  - '連続するハイフンは 1 つにまとめる'
  - '先頭・末尾のハイフンは取り除く'
  - '結果はコピーできる（既存の CopyButton を使用）'
  - '結果はリアルタイムではなく Convert ボタンで生成する'

edge cases:
  - 'empty input: 空文字列は空文字列を返す'
  - 'ASCII 以外の文字のみの入力（例: 日本語）は空文字列を返す（音訳は行わない）'
  - 'é ü ñ などのアクセント付き文字が基本文字になること'
  - '記号のみの入力（例: ???）は空文字列を返す'
  - '先頭・末尾・連続のハイフンが正規化される（-Hello---World- → hello-world）'
  - '既にスラグ形式の入力はほぼそのままになる'

required tests:
  - logic.test.ts:
      - 'プレーンな文（"Hello World"）→ hello-world'
      - '大文字・小文字・記号混在の正規化'
      - 'ダイアクリティカルマーク除去（é → e 等）'
      - '連続ハイフン・前後ハイフンの正規化'
      - 'empty input / 日本語のみ / 記号のみの入力'
  - Tool.test.tsx:
      - 'ユーザーが入力して生成できること'
      - '結果が表示され Copy ボタンが有効なこと'

allowed paths:
  - packages/tools/slug-generator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と Web Platform API（String.normalize 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
