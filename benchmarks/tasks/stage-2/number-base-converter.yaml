id: number-base-converter
difficulty: medium

description: >
  整数を基数変換するツール。10 進数以外の入力も扱え、巨大な整数も BigInt で正確に
  変換する。

requirements:
  - '基数 2 / 8 / 10 / 16 / 36 の間で整数を変換する'
  - '入力: 数値文字列 + 入力基数（select）+ 出力基数（select）'
  - '出力は入力と同値の整数を出力基数で表記した文字列（大文字は使用しない）'
  - '負数をサポートする（先頭の - を符号として扱う）'
  - '内部計算は BigInt を使い、Number の精度限界を超える桁数でも正確に変換する'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列は空文字列を返す（エラーにしない）'
  - '入力基数の桁にない文字を含む入力はエラーとして報告する（例: 2 進数に "2"）'
  - '0 はどの基数でも "0"'
  - '負数（-255 など）が正しく変換される'
  - '巨大な整数（例: 2^100 相当）が Number ではなく正確に変換される'
  - '36 進数の最大桁 z まで扱える'
  - '先頭ゼロを含む入力（007 等）は正規化される（先頭ゼロ除去）'

required tests:
  - logic.test.ts:
      - '10 進 → 2 / 8 / 16 / 36 進の変換値が期待値と一致すること'
      - '2 進 → 10 進、16 進 → 10 進の逆変換'
      - '負数の変換'
      - '0 の変換'
      - '不正桁のエラー'
      - 'BigInt 精度を超える桁数の変換（例: 2^100）'
      - '先頭ゼロの正規化'
  - Tool.test.tsx:
      - 'ユーザーが入力を基数とともに指定して変換できること'
      - '不正入力でエラーが見えること'

allowed paths:
  - packages/tools/number-base-converter/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/**

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - 既存 dependency と JavaScript 標準機能（BigInt 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
