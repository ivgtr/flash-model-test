id: semver-comparator
difficulty: medium

description: >
  SemVer 2.0.0 のバージョン文字列を検証・比較するツール。2 つのバージョンの比較、
  複数行に並んだバージョンのソート、単一比較子（>=1.2.3 等）の範囲判定を行う。

requirements:
  - 'SemVer 2.0.0 形式（MAJOR.MINOR.PATCH[-prerelease][+build]）を検証し、構成要素へ分解する'
  - '先頭の v プレフィックス（v1.2.3）を受理する'
  - '2 つのバージョンの比較結果（> / < / =）を表示する'
  - '比較は SemVer の優先順位規則に従う（pre-release < release、識別子の比較規則）'
  - '複数行入力の各バージョンを昇順 / 降順でソートする'
  - '単一比較子（> / >= / < / <= / =、例: >=1.2.3）と 1 バージョンの範囲判定ができる'
  - '不正なバージョン（欠落 / 先頭ゼロ / 空識別子 / 不正文字）はエラーとして報告する'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列はエラーとして報告する'
  - '1.2.3-alpha < 1.2.3-alpha.1 < 1.2.3-alpha.beta < 1.2.3-beta < 1.2.3'
  - '1.0.0-alpha < 1.0.0（pre-release は常に release より低い）'
  - 'ビルドメタデータ（+build）は比較に影響しない'
  - '先頭ゼロ（01.2.3）は不正'
  - '番号識別子は数値比較、英数識別子は辞書順、数値 < 英数（SemVer 規則）'
  - 'ソートで不正な行が混ざった場合はエラーとして報告する（無視しない）'
  - '比較子に不正な演算子 / 不正なバージョンはエラー'

required tests:
  - logic.test.ts:
      - '有効なバージョンのパース（v プレフィックス含む）'
      - '比較の各規則（pre-release / 識別子 / ビルドメタデータ）'
      - '不正バージョン（先頭ゼロ・欠落・空識別子）のエラー'
      - 'ソート（昇順 / 降順）と不正行のエラー'
      - '範囲判定（各比較子）'
  - Tool.test.tsx:
      - 'ユーザーがバージョンを入力して比較結果が表示されること'
      - 'エラーがユーザーに見えること'

allowed paths:
  - packages/tools/semver-comparator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/** / 他の packages/tools/** 配下

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - JavaScript 標準機能だけで実装する（SemVer 比較は独自実装）
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
