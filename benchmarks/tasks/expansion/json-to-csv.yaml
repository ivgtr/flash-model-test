id: json-to-csv
difficulty: medium

description: >
  JSON（オブジェクトの配列）を CSV テキストへ変換するツール。キーの集合を
  ヘッダーとして使う。CSV は標準的な引用ルール（区切り文字・引用符・改行を含む
  フィールドのクォート）でシリアライズする。

requirements:
  - 'オブジェクトの配列を CSV へ変換する'
  - 'ヘッダーは全オブジェクトのキーの出現順（最初のオブジェクトから順に追加）で決める'
  - 'フィールド値は string / number / boolean / null をサポートし、null / undefined は空フィールドにする'
  - 'CSV シリアライズは標準ルール: 区切り文字・ダブルクォート・改行を含む値は引用し、引用内の " は "" にする'
  - '区切り文字を選択できる: コンマ / セミコロン / タブ（デフォルト コンマ）'
  - 'オブジェクト以外の値（プリミティブ配列やネスト含む）はエラーとして報告する'
  - '出力はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列はエラーとして報告する'
  - '空配列 [] は空文字列を出力する（エラーにしない）'
  - 'キーの出現順が異なるオブジェクト（後続に新しいキー）で列が追記される'
  - 'キーが欠けているオブジェクトの該当フィールドは空になる'
  - '値に含まれる改行・引用符・区切り文字の正しいクォート'
  - 'number / boolean の文字列化（true / 1.5 等）'
  - 'JSON 自体が不正な場合はエラーとして報告する'

required tests:
  - logic.test.ts:
      - '基本の 2 オブジェクト変換結果の検証'
      - 'キー順の差異がある場合の列の追記'
      - '欠けているキーの空フィールド'
      - '引用のルール（改行 / 引用符 / 区切り文字）'
      - '区切り文字の選択'
      - '空配列 / 空入力 / 不正 JSON / プリミティブ配列のエラー'
  - Tool.test.tsx:
      - 'ユーザーが JSON を入力して CSV が表示されること'
      - 'エラーがユーザーに見えること'

allowed paths:
  - packages/tools/json-to-csv/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/** / 他の packages/tools/** 配下

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - JavaScript 標準機能だけで実装する（CSV シリアライザは独自実装）
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
