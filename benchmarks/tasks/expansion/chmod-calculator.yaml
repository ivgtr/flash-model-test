id: chmod-calculator
difficulty: easy

description: >
  chmod のパーミッション表現を相互変換するツール。8 進数（755 / 4755 等）と
  記号表記（rwxr-xr-x）のどちらからでも、8 進数・記号・2 進数・各クラス
  （user / group / other）の読み方を表示する。setuid / setgid / sticky ビットを
  サポートする。

requirements:
  - '入力として 3 桁 / 4 桁の 8 進数を受理する（4 桁目は setuid=4 / setgid=2 / sticky=1）'
  - '記号表記（例: rwxr-xr-x）も入力として受理する'
  - '出力: 8 進数（4 桁、特殊ビット含む）、記号表記、ビット列（2 進数）、user / group / other の各読み方'
  - '記号表記の許可文字は r / w / x / s / S / t / T / - とし、無効な並びはエラーとして報告する'
  - '記号入力で特殊ビット（s / t）は 4 桁 8 進数として表示する'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列はエラーとして報告する'
  - '8 進数に 8 / 9 が含まれる場合はエラー'
  - '3 桁以外（2 桁 / 5 桁）の 8 進数はエラー'
  - 's は実行ビット付き（rws）でのみ有効、実行ビットなしは S として表示（無効ではない）'
  - 't は other の実行ビット付き（rwt）でのみ有効、なしは T'
  - '記号表記のクラス順が決まっている（user → group → other）ことの検証'
  - '000 / 777 の境界値'

required tests:
  - logic.test.ts:
      - '8 進数 → 記号 / 2 進数 / クラス読みの変換'
      - '記号 → 8 進数の変換'
      - '特殊ビット（setuid / setgid / sticky）を含む変換'
      - '無効入力（8 / 9 / 桁数 / 不正文字）のエラー'
      - '000 / 777 / 4755 等の境界値'
  - Tool.test.tsx:
      - 'ユーザーが 8 進数を入力して変換結果が表示されること'
      - '記号表記からの変換も動作すること'

allowed paths:
  - packages/tools/chmod-calculator/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/** / 他の packages/tools/** 配下

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - JavaScript 標準機能だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
