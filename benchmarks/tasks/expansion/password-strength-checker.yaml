id: password-strength-checker
difficulty: easy

description: >
  パスワードの強度をヒューリスティックに評価するツール。長さ・文字種（小文字 /
  大文字 / 数字 / 記号）の多様性・繰り返し・連続文字を考慮した 0〜4 段階のスコアと、
  各チェック項目の一覧、エントロピー推定値（ビット）を表示する。外部の
  共通パスワードデータベースは使わず、あくまでヒューリスティックな目安である旨を
  description と UI に明記する。

requirements:
  - 'スコア 0〜4 を返す（0: 非常に弱い〜4: 強い）'
  - 'スコアは長さ・文字種の多様性・繰り返し・連続文字を考慮した決定的なルールで計算する'
  - 'チェックリストを表示する: 長さ 8 文字以上 / 12 文字以上 / 大文字を含む / 小文字を含む / 数字を含む / 記号を含む / 繰り返し・連続文字が少ない'
  - 'エントロピー推定: 使用文字種のプールサイズから log2(pool^length) を計算して表示する'
  - 'パスワードはブラウザ内でのみ処理される旨を UI に明記する'
  - '共通パスワード辞書は使わない旨を description に明記する'

edge cases:
  - 'empty input: 空文字列はスコア 0 を返す（エラーにしない）'
  - '1 文字のみ / 全文字同一の入力はスコア 0〜1'
  - 'Unicode 文字（日本語等）は記号として扱わず「その他」として扱う（詳細は description に明記）'
  - '長さ 100 文字以上はエントロピー計算を上限で打ち切る（巨大な数値にならないようにする）'
  - 'スコア計算は決定的である（同じ入力に同じ結果）'
  - '連続文字（abc / 123）と繰り返し（aaaa）のペナルティが効く'

required tests:
  - logic.test.ts:
      - '長さ・文字種ごとのスコア変化'
      - '繰り返し / 連続文字のペナルティ'
      - 'エントロピー計算（既知の値との一致）'
      - '空入力・1 文字・長い入力'
      - '決定性（同一入力の再現）'
  - Tool.test.tsx:
      - 'ユーザーがパスワードを入力してスコアとチェックリストが表示されること'

allowed paths:
  - packages/tools/password-strength-checker/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/** / 他の packages/tools/** 配下

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - JavaScript 標準機能（Math.log2 等）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
