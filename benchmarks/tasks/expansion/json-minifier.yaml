id: json-minifier
difficulty: easy

description: >
  JSON を最小化（圧縮）するツール。JSON.parse → JSON.stringify の
  ネイティブ round-trip で不要な空白を取り除き、サイズ削減率を表示する。

requirements:
  - '入力 JSON をパースし、区切り空白なしの最小形式で再出力する'
  - '整形版 / 圧縮版のどちらでも出力できる（デフォルト 圧縮）'
  - '圧縮前後のバイト数（UTF-8）と削減率を表示する'
  - '結果はコピーできる（既存の CopyButton を使用）'

edge cases:
  - 'empty input: 空文字列はエラーとして報告する'
  - '不正な JSON はエラーとして報告する'
  - '既に最小化された JSON はそのまま出力される'
  - '整形された JSON は最小化される'
  - 'JSON.parse / stringify の round-trip で値が変わらない（配列順・オブジェクトのキー順は保持）'
  - '数値の精度: ネイティブ JSON round-trip の仕様であり、巨大数は精度が変わり得る旨を description に明記する'
  - 'Unicode のバイト数計算は UTF-8 エンコード（TextEncoder）で行う'

required tests:
  - logic.test.ts:
      - '整形 JSON の最小化結果'
      - '既に最小化された JSON の恒等性'
      - '不正 JSON / 空入力のエラー'
      - '削減率の計算'
      - 'ネストの深い JSON の最小化'
  - Tool.test.tsx:
      - 'ユーザーが JSON を入力して最小化結果が表示されること'
      - 'エラーがユーザーに見えること'

allowed paths:
  - packages/tools/json-minifier/**

forbidden changes:
  - root package.json / pnpm-workspace.yaml / pnpm-lock.yaml
  - packages/core/** / packages/ui/** / apps/web/** / scripts/**
  - README.md / results/** / benchmarks/** / 他の packages/tools/** 配下

validation commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm build

dependency policy:
  - 新しい npm dependency を追加しない
  - JavaScript 標準機能（JSON / TextEncoder）だけで実装する
  - 実装にどうしても新しい dependency が必要な場合は実装を止めて ESCALATE: DEPENDENCY_REQUIRED を返す
